services:
  mysql-space-management:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: space_management
      MYSQL_USER: sentrya
      MYSQL_PASSWORD: sentrya
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "${SPACE_MYSQL_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - space-management-data:/var/lib/mysql
      - ../migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro

  space-management:
    build:
      context: ../..
      dockerfile: space-management/Dockerfile
    environment:
      HTTP_ADDR: ":8081"
      MYSQL_DSN: sentrya:sentrya@tcp(mysql-space-management:3306)/space_management?parseTime=true
    ports:
      - "${SPACE_HTTP_PORT:-8081}:8081"
    depends_on:
      mysql-space-management:
        condition: service_healthy

volumes:
  space-management-data:
